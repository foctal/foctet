[package]
name = "foctet-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Thin HTTP adapter for application/foctet body envelopes"
readme = "../README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
foctet-core = { workspace = true }
http = "1.4"
thiserror.workspace = true
zeroize.workspace = true
axum = { version = "0.8", optional = true }
http-body-util = { version = "0.1", optional = true }
redis = { version = "1.3", optional = true, default-features = false, features = ["tokio-comp"] }

[dev-dependencies]
rand_core.workspace = true
getrandom.workspace = true
x25519-dalek.workspace = true
tokio = { version = "1.48", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
futures-util = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { version = "0.8.5", optional = true }

[features]
default = []
axum = ["dep:axum", "dep:http-body-util"]
workers = ["dep:worker"]
redis = ["dep:redis"]

[[example]]
name = "axum_body_echo_server"
required-features = ["axum"]

[[example]]
name = "axum_body_echo_client"
required-features = ["axum"]

[[example]]
name = "workers_echo_client"

[[example]]
name = "workers_kv_vault_client"
