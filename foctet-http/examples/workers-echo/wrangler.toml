name = "foctet-http-workers-echo"
main = "build/index.js"
compatibility_date = "2026-03-08"

[vars]
FOCTET_INTEGRATION_TESTS = "1"

[[durable_objects.bindings]]
name = "FOCTET_REPLAY"
class_name = "FoctetReplay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FoctetReplay"]

[build]
command = "cargo install -q worker-build --version 0.8.7 --locked && worker-build --release"
