[package]
readme = "README.md"
name = "foctet-storage-wire"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Portable signed text records and SQL plans for Worker storage"

[features]
default = []
workers = ["dep:worker", "dep:futures-util", "dep:serde_json", "dep:zeroize"]

[dependencies]
foctet-core = { path = "../foctet-core", version = "0.5.0", default-features = false }
base64 = "0.22"
thiserror.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { version = "0.8.7", features = ["d1"], optional = true }
futures-util = { version = "0.3", optional = true }
serde_json = { version = "1", optional = true }
zeroize = { workspace = true, optional = true }

[dev-dependencies]
futures = { version = "0.3", features = ["executor"] }
x25519-dalek.workspace = true
serde_json = "1"
