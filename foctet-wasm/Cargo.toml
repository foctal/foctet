[package]
name = "foctet-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "WebAssembly bindings for Foctet end-to-end encryption (body envelopes)"
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
foctet-core = { path = "../foctet-core", version = "0.3.0", default-features = false }
foctet-http = { path = "../foctet-http", version = "0.3.0", default-features = false }
wasm-bindgen = "0.2"
x25519-dalek = { workspace = true }
rand_core = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `OsRng` flows through `rand_core -> getrandom`; wasm32 needs explicit JS support.
getrandom = { version = "0.2", features = ["js"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
# In-browser integration tests: `wasm-pack test --headless --chrome foctet-wasm`.
wasm-bindgen-test = "0.3"
# Exercises the browser WebTransport datagram adapter against in-page mock
# streams inside real headless Chrome (see tests/browser.rs).
foctet-transport = { path = "../foctet-transport", version = "0.3.0", default-features = false, features = ["transport-webtrans-browser"] }
js-sys = "0.3"
wasm-bindgen-futures = "0.4"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
