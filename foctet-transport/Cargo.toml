[package]
name = "foctet-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Layered transport integration helpers for Foctet secure channels"
readme = "../README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
runtime-tokio = ["dep:tokio", "foctet-core/runtime-tokio", "dep:futures-sink"]
runtime-futures = ["dep:futures-io", "dep:futures-sink", "dep:futures-util", "foctet-core/runtime-futures"]
transport-muxtls = ["dep:muxtls"]
transport-webtrans = ["dep:webtrans"]
# Cross-platform raw-WebSocket message transport (`WebsockMessageTransport`),
# usable on native and in the browser (wasm) via the `websock` crate's backends.
transport-websock = ["dep:websock", "dep:futures-util"]
# Native multiplexed-WebSocket byte-stream helpers (require a Tokio runtime).
transport-websock-mux = ["transport-websock", "runtime-tokio", "dep:websock-tungstenite-mux"]
transport-quinn = ["dep:quinn", "dep:bytes"]
# Browser WebTransport datagram adapter (wasm32 only): implements
# `DatagramTransport` over a `WebTransport.datagrams` duplex handed in from JS.
transport-webtrans-browser = ["dep:wasm-bindgen", "dep:js-sys", "dep:wasm-bindgen-futures"]

[dependencies]
foctet-core = { workspace = true }
pin-project-lite = "0.2"
futures-io = { version = "0.3", optional = true }
futures-sink = { version = "0.3", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["io", "std"], optional = true }
tokio = { version = "1.48", features = ["io-util", "time", "sync"], optional = true }
muxtls = { version = "0.1.0", default-features = false, optional = true }
webtrans = { version = "0.4.0", default-features = false, optional = true }
websock = { version = "0.4.0", default-features = false, optional = true }
websock-tungstenite-mux = { version = "0.4.0", optional = true }
quinn = { version = "0.11.9", default-features = false, optional = true }
bytes = { version = "1", optional = true }
thiserror = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }

[dev-dependencies]
tokio = { version = "1.48", features = ["macros", "rt", "rt-multi-thread", "io-util", "time"] }
foctet-core = { workspace = true, features = ["runtime-tokio"] }
websock-tungstenite-mux = "0.4.0"
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rcgen = "0.14"
url = "2"
clap = { version = "4", features = ["derive"] }
rustls-pemfile = "2"
bytes = "1"

[[example]]
name = "muxtls_split"
path = "examples/muxtls_split.rs"
required-features = ["runtime-tokio", "transport-muxtls"]

[[example]]
name = "webtrans_split"
path = "examples/webtrans_split.rs"
required-features = ["runtime-tokio", "transport-webtrans"]

[[example]]
name = "websock_split"
path = "examples/websock_split.rs"
required-features = ["runtime-tokio", "transport-websock-mux"]

[[example]]
name = "quinn_split"
path = "examples/quinn_split.rs"
required-features = ["runtime-tokio", "transport-quinn"]

[[example]]
name = "udp_datagram_split"
path = "examples/udp_datagram_split.rs"
required-features = ["runtime-tokio"]

[[example]]
name = "websock_message_server"
path = "examples/websock_message_server.rs"
required-features = ["runtime-tokio", "transport-websock"]

[[example]]
name = "webtrans_datagram_split"
path = "examples/webtrans_datagram_split.rs"
required-features = ["runtime-tokio", "transport-webtrans"]
