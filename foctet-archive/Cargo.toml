[package]
name = "foctet-archive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Foctet Secure Archive: encrypted manifest/chunks with recipient key wrapping"
readme = "../README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
blake3.workspace = true
chacha20poly1305.workspace = true
hkdf.workspace = true
rand_core.workspace = true
getrandom.workspace = true
rkyv.workspace = true
sha2.workspace = true
thiserror.workspace = true
x25519-dalek.workspace = true
zeroize.workspace = true
foctet-core = { workspace = true }

vsss-rs = { version = "6.0.1", default-features = false, features = ["std", "zeroize"], optional = true }

[features]
default = []
threshold = ["dep:vsss-rs"]

[dev-dependencies]
serde_json = "1"
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = "1.6"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = "3.27"
