[workspace]
resolver = "2"
members = [
  "foctet",
  "foctet-core",
  "foctet-http",
  "foctet-archive",
  "foctet-transport",
  "foctet-wasm",
  "fuzz"
]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
authors = ["shellrow <shellrow@foctal.com>"]
license = "Apache-2.0"
repository = "https://github.com/foctal/foctet"
description = "Transport-agnostic end-to-end encryption layer for secure data transfer."

[workspace.dependencies]
blake3 = "1.8"
bytes = "1.10"
chacha20poly1305 = "0.11"
ed25519-dalek = { version = "3", default-features = false, features = ["rand_core"] }
hkdf = "0.13"
rand_core = "0.10"
getrandom = { version = "0.4", features = ["sys_rng"] }
rkyv = { version = "0.8", features = ["bytecheck"] }
sha2 = "0.11"
subtle = "2.6"
thiserror = "2.0"
x25519-dalek = { version = "3", features = ["static_secrets", "getrandom", "zeroize"] }
zeroize = "1.8"
foctet-core = { path = "foctet-core", version = "0.4.0" }
foctet-http = { path = "foctet-http", version = "0.4.0" }
foctet-archive = { path = "foctet-archive", version = "0.4.0" }
foctet-transport = { path = "foctet-transport", version = "0.4.0" }
