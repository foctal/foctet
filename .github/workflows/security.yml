name: Security audit

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Check advisory exception review dates
        run: bash scripts/check-advisory-exceptions.sh
      - name: Check dependency advisories
        run: |
          cargo audit --db "$RUNNER_TEMP/foctet-cargo-audit-db" --deny warnings
          for lockfile in foctet-http/examples/workers-echo/Cargo.lock foctet-http/examples/workers-kv-vault/Cargo.lock; do
            cargo audit --db "$RUNNER_TEMP/foctet-cargo-audit-db" --no-fetch --file "$lockfile" --deny warnings
          done
      - name: Check JavaScript development and interop advisories
        run: |
          for directory in packages/worker-storage interop foctet-wasm/examples/browser foctet-http/examples/workers-echo foctet-http/examples/workers-kv-vault; do
            (cd "$directory" && npm audit --audit-level=low)
          done
