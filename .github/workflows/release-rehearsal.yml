name: Clean-room release rehearsal

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: "Previously released tag used for SemVer comparison"
        required: true
        default: "v0.6.0"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  api-and-package:
    name: API and npm compatibility rehearsal
    runs-on: ubuntu-latest
    env:
      BASELINE_REV: ${{ inputs.baseline }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Install stable Rust and WASM target
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown
      - name: Install pinned release tools
        run: |
          cargo install cargo-semver-checks --version 0.51.0 --locked
          cargo install wasm-pack --version 0.14.0 --locked
      - name: Verify baseline exists
        run: git rev-parse --verify --end-of-options "${BASELINE_REV}^{commit}"
      - name: Check Rust SemVer compatibility
        run: cargo semver-checks check-release --workspace --baseline-rev "$BASELINE_REV"
      - name: Verify Rust release packages
        run: cargo package --workspace --exclude foctet-fuzz --locked
      - name: Test minimal runtime feature configurations
        run: |
          cargo test -p foctet-transport --no-default-features --features runtime-tokio --locked
          cargo test -p foctet-transport --no-default-features --features runtime-futures --locked
      - name: Check WASM release target
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          cargo check -p foctet-http --features workers --locked --target wasm32-unknown-unknown
          cargo check -p foctet-wasm --locked --target wasm32-unknown-unknown
          cargo check -p foctet-transport --no-default-features --features transport-websock,transport-webtrans-browser --locked --target wasm32-unknown-unknown
      - name: Build and smoke-test Node, browser, and bundler packages
        working-directory: foctet-wasm
        run: npm run test:package
      - name: Run independent vectors
        working-directory: interop
        run: npm ci && npm test

  target-matrix:
    name: Locked release build (${{ matrix.os }}, ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install target
        run: rustup target add ${{ matrix.target }}
      - name: Build locked release artifacts
        run: cargo build --workspace --all-features --release --locked --target ${{ matrix.target }}
      - name: Test host target
        run: cargo test --workspace --all-features --release --locked --target ${{ matrix.target }}
