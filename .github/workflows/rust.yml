name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup stable toolchain
      run: |
        rustup toolchain install stable --profile minimal --component clippy
        rustup default stable
        rustup target add wasm32-unknown-unknown
    - name: Lint
      run: cargo clippy --workspace --all-features -- -D warnings
    - name: Workspace tests
      run: cargo test --workspace --verbose
    - name: Wasm check
      run: cargo check -p foctet-http --features workers --target wasm32-unknown-unknown
    - name: Feature combinations (foctet-core)
      run: |
        cargo test -p foctet-core --no-default-features
        cargo test -p foctet-core --no-default-features --features runtime-futures
        cargo test -p foctet-core --no-default-features --features runtime-tokio

  security-audit:
    runs-on: ubuntu-latest

    # Vulnerability/advisory scan only (no license checks) via the official
    # RustSec action, which uses a prebuilt `cargo-audit` instead of compiling
    # it from source, so this job stays fast.
    steps:
    - uses: actions/checkout@v4
    - uses: rustsec/audit-check@v2.0.0
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
