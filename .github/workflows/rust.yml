name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Native and browser regressions run on Windows, Linux, and macOS.
# Broader packaging checks belong to the manually dispatched release rehearsal.
jobs:
  check:
    name: Format, lint, and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup stable toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - name: Check packaged test fixtures
        run: python3 scripts/check-test-fixtures.py
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Check transport features independently
        run: |
          for feature in transport-muxtls transport-websock transport-websock-mux transport-quinn transport-quion transport-webtrans transport-webtrans-quion; do
            cargo check -p foctet --no-default-features --features "$feature" --locked
            cargo test -p foctet-transport --no-default-features --features "$feature" --test conformance --locked
          done
      - name: Check archive WASM targets
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check -p foctet-archive --all-targets --all-features --locked --target wasm32-unknown-unknown
          cargo clippy -p foctet-storage-wire -p foctet-http -p foctet-transport --features workers,transport-websock --locked --target wasm32-unknown-unknown -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features --locked

  storage:
    name: Disposable database integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Exercise MySQL, MariaDB, PostgreSQL and libSQL
        run: python3 scripts/test-storage-databases.py

  browser:
    name: Browser interoperability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            chrome: /usr/bin/google-chrome
          - os: windows-latest
            chrome: 'C:\Program Files\Google\Chrome\Application\chrome.exe'
          - os: macos-latest
            chrome: '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'
    defaults:
      run:
        shell: bash
    env:
      CHROME_PATH: ${{ matrix.chrome }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install WASM build tools
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          cargo install wasm-pack --version 0.14.0 --locked
      - name: Test browser SDK and WebTransport rekey, loss, and reordering
        working-directory: foctet-wasm/examples/browser
        run: |
          npm ci
          npm run test:webtransport

  worker-databases:
    name: Worker storage adapters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install WASM toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
          cargo install worker-build --version 0.8.7 --locked
      - name: Test portable codecs and local Worker database connections
        working-directory: packages/worker-storage
        run: |
          npm ci
          npm test
          npm run test:types
          npm run test:databases
          cargo fmt --manifest-path ../../foctet-storage-wire/examples/workers/Cargo.toml -- --check
          cargo clippy --manifest-path ../../foctet-storage-wire/examples/workers/Cargo.toml --all-features --target wasm32-unknown-unknown --locked -- -D warnings
          npm run test:workers-rs
